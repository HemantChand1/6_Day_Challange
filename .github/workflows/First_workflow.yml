name: First_workflow
on: push

jobs:
  job1:
    name: Data
    runs-on: ubuntu-latest
    steps:
      - name: Chaecking the current directory
        run: |
          pwd
          ls -al
  job2:
    needs: job1
    name: adding additonal data
    runs-on: ubuntu-latest
    steps:
      - name: adding file
        run: mkdir Test
      - name: adding data to directory
        run: | 
          cd ./Test
          echo "This is the test file to be tested in the repo" > mono.txt
      - name: checkout
        uses: actions/checkout@v2.8.0
      - name: check data again
        run: ls -al
  job3:
    name: No dependency
    runs-on: ubuntu-latest
    steps:
      - name: Setting up timer
        run: sleep 15
  job4:
    needs: [job1, job2, job3]
    name: Multiple dependencies 
    runs-on: ubuntu-latest
    steps:
      - name: This is to set 
        run: sleep 5 sec
        
