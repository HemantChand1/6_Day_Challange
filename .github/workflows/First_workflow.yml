name: First_workflow
on: 
  # push
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  
jobs:
  job1:
    name: Data
    runs-on: ubuntu-latest
    steps:
      - name: Chaecking the current directory
        run: |
          pwd
          ls -al
          hostnamectl
      - name: checkout
        uses: actions/checkout@v5.1.0
      - name: step-3
        run: |
          echo "THIS IS THE DATA THAT WILL BE PLACED IN THE ARTIFACT" >> MY_FILE.txt
          ls -ltr
      - name: artifact
        uses: @actions/upload-artifact
        with:
          name: File_!
          path: ./MY_FILE.txt
          
          
  
