name: First_workflow

on: 
  push:
    branches: 
      - Dev
  pull_request:
    branches:
      - main

jobs:
  unit-test:
    name: Unit testing the application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5.1.0
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Installing python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          
      - name: Run unit test
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
        
      - name: upload code coverage report
        uses: actions/upload-artifact@5.0.0

        with:
          name: unit-test-report
          path: reports/

        
