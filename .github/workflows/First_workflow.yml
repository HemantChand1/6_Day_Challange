name: First_workflow
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
        
jobs:
  job1:
    name: Data
    runs-on: ubuntu-latest
    steps:
      - name: Checking the current directory
        run: |
          pwd
          ls -al
          hostnamectl
      - name: checkout
        uses: actions/checkout@v5.1.0
      - name: step-3
        run: |
          echo "THIS IS THE DATA THAT WILL BE PLACED IN THE ARTIFACT" >> MY_FILE.txt
          ls -ltr
      - name: artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: File_1
          path: ./MY_FILE.txt

  
  job2:
    needs: job1
    name: Download artifacts
    runs-on: ubuntu-latest
    steps:
        - name: Creating Directories
          run : |
            mkdir Single_File
            
        - name: upload single artifact
          uses: actions/download-artifact@v7.0.0
          with:
            name: File_1
            path: ./Single_File
        - name: Checking if single file is downloaded 
          run: ls -al ./Single_File


