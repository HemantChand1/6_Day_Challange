name: First_workflow
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


env:
  ENV_TYPE: Development  # setting up the environment variables 
  ENV_USER: Himanshu Kumar # setting up the environment variables
  ENV_PATH: /Home/data/key # setting up the environment variables

jobs:
  job1:
    name: Data
    runs-on: ubuntu-latest
    steps:
      - name: Checking the current directory
        run: |
          pwd
          ls -al
          hostnamectl
      - name: checkout
        uses: actions/checkout@v5.1.0
      - name: step-3
        run: |
          echo "THIS IS THE DATA THAT WILL BE PLACED IN THE ARTIFACT" >> MY_FILE.txt
          ls -ltr
      - name: artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: File_1
          path: ./MY_FILE.txt

  
  job2:
    needs: job1
    name: Download artifacts
    runs-on: ubuntu-latest
    steps:
        - name: Creating Directories
          run : |
            mkdir Single_File
            
        - name: upload single artifact
          uses: actions/download-artifact@v7.0.0
          with:
            name: File_1
            path: ./Single_File
        - name: Checking if single file is downloaded 
          run: ls -al ./Single_File


  job3:
    name: Environment variable testing 
    runs-on: ubuntu-latest
    steps:
      - name: Variable testig 
        run: |
          echo "This is the ${ENV_TYPE} Environment"
          echo "This is the ${ENV_USER} used in the environment"
          echo "This is the ${ENV_PATH} used"
      - name: using a secret name 
        run: echo "For ${ENV_TYPE} the the Application Password is ${{ secrets.APP_PASSWORD }}"
      - name: "Let's check the inbuild varibles in git "
        run: |
          echo "The current repo and it's details are in - ${{ github.action_repository }}"
          echo "What is the job status - ${{ job.status }}"
          echo "The runner name is - ${{ runner.name }}"
          echo "The runner OS is - ${{ runner.os }} " 

  Staging:
    runs-on: ubuntu-latest
    steps:
      - name: This is to check the values of the environment
        run: |
          echo "[INFO] The environment varibale are with host ${{ vars.HOST }} and using password ${{ vars.USER }} "
          echo "[INFO] The environment varible password is ${{ secrets.PASSWORD }} "
    environment:
        name: STAGING
    #if: github.head_ref == 'refs/heads/Dev' # setting condition to run on particular branch based on the condition 
    # the github.ref is an environment varibale and first check what to use based on the environment variable 
    # we can also use github.head_ref --> depending on the situation if we are using this as pull request 
    if: github.head_ref == 'Dev'
    
  Production:
    runs-on: ubuntu-latest
    steps:
      - name: This is to check the values in the production environment
        run: |
          echo "[INFO] This is to check the varibale in prod where host is ${{ vars.HOST }} & USER is ${{ vars.USER }}"
          echo "[INFO] This is to check the value in prod for the password ${{ secrets.PASSWORD }}

    environment:
      name: PRODUCTION

    if: github.ref == 'refs/heads/main'
